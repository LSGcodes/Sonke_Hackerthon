<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Guardian SA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 2 L28 7 V15 C28 22.5 22.8 27.8 16 30 C9.2 27.8 4 22.5 4 15 V7 Z%22 fill=%22%230F766E%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .auth-wrap { min-height: calc(100vh - 130px); display: flex; align-items: center; justify-content: center; padding: var(--space-6) var(--space-4); }
  .auth-card { max-width: 420px; width: 100%; padding: var(--space-6); }
  .auth-head { text-align: center; margin-bottom: var(--space-6); }
  .auth-head .brand-mark { width: 44px; height: 44px; margin: 0 auto var(--space-4); }
  .auth-head h1 { font-size: 1.5rem; margin-bottom: var(--space-2); }
  .auth-head p { color: var(--color-ink-soft); font-size: 0.92rem; }
  .auth-foot { text-align: center; margin-top: var(--space-5); font-size: 0.9rem; color: var(--color-ink-soft); }
  .auth-skel { max-width: 420px; width: 100%; padding: var(--space-6); }
</style>
</head>
<body>
<div id="nav-mount"></div>

<main class="auth-wrap">
  <!-- Skeleton loader shown while the page "boots" -->
  <div class="card auth-skel" id="auth-skeleton" data-skeleton>
    <div class="skeleton skel-circle" style="margin:0 auto 16px;"></div>
    <div class="skeleton skel-title" style="margin:0 auto 24px; width:50%;"></div>
    <div class="skeleton skel-text" style="height:44px; border-radius:8px; margin-bottom:16px;"></div>
    <div class="skeleton skel-text" style="height:44px; border-radius:8px; margin-bottom:16px;"></div>
    <div class="skeleton skel-text" style="height:44px; border-radius:999px;"></div>
  </div>

  <div class="card auth-card" id="auth-content" hidden>
    <div class="auth-head">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 2 L28 7 V15 C28 22.5 22.8 27.8 16 30 C9.2 27.8 4 22.5 4 15 V7 Z" fill="#0F766E"/>
        <path d="M16 2 L28 7 V15 C28 22.5 22.8 27.8 16 30 V2 Z" fill="#14B8A6"/>
        <path d="M16 9 L16 18 M16 22 L16.01 22" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <h1>Welcome back</h1>
      <p>Log in to your Guardian SA account.</p>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field-error" id="email-error">Please enter a valid email address.</div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-error" id="password-error">Please enter your password.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
    </form>

    <p class="auth-foot">Don't have an account? <a href="signup.html" style="color:var(--color-primary); font-weight:700;">Create one</a></p>
  </div>
</main>

<div id="footer-mount"></div>

<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script>
  mountNavAndFooter('login');

  // Simulated "boot" delay to demonstrate the skeleton loader.
  revealContent('#auth-content', { skeletonSelector: '#auth-skeleton', delay: 450 });

  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('login-btn');

  document.getElementById('toggle-password').addEventListener('click', () => {
    const isPw = passwordInput.type === 'password';
    passwordInput.type = isPw ? 'text' : 'password';
  });

  function setFieldError(input, errorEl, message) {
    input.classList.add('input-error');
    errorEl.textContent = message;
    errorEl.classList.add('show');
  }
  function clearFieldError(input, errorEl) {
    input.classList.remove('input-error');
    errorEl.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    let valid = true;
    const emailErr = document.getElementById('email-error');
    const pwErr = document.getElementById('password-error');
    clearFieldError(emailInput, emailErr);
    clearFieldError(passwordInput, pwErr);

    if (!emailInput.value.trim() || !/^\S+@\S+\.\S+$/.test(emailInput.value.trim())) {
      setFieldError(emailInput, emailErr, 'Please enter a valid email address.');
      valid = false;
    }
    if (!passwordInput.value) {
      setFieldError(passwordInput, pwErr, 'Please enter your password.');
      valid = false;
    }
    if (!valid) return;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in…';

    try {
      const user = await verifyLogin(emailInput.value, passwordInput.value);
      setSession(user.email);
      showToast('success', 'Welcome back', `Signed in as ${user.name}.`);
      setTimeout(() => window.location.href = 'dashboard.html', 500);
    } catch (err) {
      if (err.message === 'NO_ACCOUNT') {
        showToast('error', 'Account not found', 'No Guardian SA account exists for that email. Check the address or create an account.');
        setFieldError(emailInput, emailErr, 'No account found with this email.');
      } else if (err.message === 'WRONG_PASSWORD') {
        showToast('error', 'Incorrect password', 'That password doesn\'t match this account. Please try again.');
        setFieldError(passwordInput, pwErr, 'Incorrect password.');
      } else {
        showToast('error', 'Login failed', 'Something went wrong while logging you in. Please try again.');
      }
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
